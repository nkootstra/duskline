name: Collect model lifecycle data

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: lifecycle-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Collect official sources
        run: bun run collect
        env:
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          FIREWORKS_ACCOUNT_ID: ${{ vars.FIREWORKS_ACCOUNT_ID }}
      - run: bun run --cwd apps/collector validate
      - name: Write collection summary
        run: |
          bun -e 'const d=await Bun.file("data/source-status.json").json(); const bad=d.sources.filter(s=>s.status!=="healthy"); await Bun.write(process.env.GITHUB_STEP_SUMMARY, `## Lifecycle collection\n\n- Published: ${d.last_published_at ?? "not yet"}\n- Sources: ${d.sources.length - bad.length} healthy / ${bad.length} degraded\n\n${bad.map(s=>`- ${s.source_id}: ${s.status} (${s.error_code ?? "no error"})`).join("\n")}\n`)'
      - uses: actions/upload-artifact@v4
        with:
          name: lifecycle-data
          path: data/*.json
          retention-days: 7

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v4
        with:
          name: lifecycle-data
          path: data
      - run: bun install --frozen-lockfile
      - run: bun run infra:check
      - run: bun run --cwd apps/collector validate
      - name: Verify generated path allowlist
        run: |
          unexpected="$(git diff --name-only | grep -vE '^data/(current|changes|source-status)\.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated paths:"
            echo "$unexpected"
            exit 1
          fi
      - id: diff
        name: Detect semantic publication
        run: |
          if git diff --quiet -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit generated data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "duskline-data"
          git config user.email "duskline-data@users.noreply.github.com"
          git add data/current.json data/changes.json data/source-status.json
          git commit -m "data: publish model lifecycle changes"
          git push
      - name: Deploy with Alchemy
        if: steps.diff.outputs.changed == 'true' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: bun alchemy deploy --stage prod --yes
      - name: Verify deployed assets
        if: steps.diff.outputs.changed == 'true' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: bun apps/web/scripts/smoke-deployment.ts
